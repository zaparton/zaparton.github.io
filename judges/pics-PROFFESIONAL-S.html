<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צפרתון 2026 - תמונות לניקוד</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Rubik', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.25s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .glass-btn:active {
            transform: scale(0.95);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Card hover animation */
        .img-card {
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .img-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* Lightbox Modal Animations */
        #lightboxModal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #lightboxModal.hidden-modal {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        #lightboxModal.active-modal {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .lightbox-img-container {
            transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
        }
        .lightbox-img-container.sliding {
            opacity: 0.3;
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/80 px-4 py-4 md:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-bold fa-images text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                        צפרתון 2026 - מקצה בוגרים
                    </h1>
                    <p class="text-xs text-slate-400">תמונות שעברו סינון ועומדות לקראת ניקוד שופטים</p>
                </div>
            </div>

            <!-- Stats Badge -->
            <div class="flex items-center gap-2 text-xs font-medium text-slate-300 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50">
                <i class="fa-solid fa-photo-film text-indigo-400"></i>
                <span>סה"כ תמונות:</span>
                <span id="totalPhotosCount" class="font-bold text-indigo-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-8 md:px-8 flex-grow">
        <!-- Gallery Grid -->
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Dynamic elements loaded via JS -->
        </div>
    </main>

    <div id="lightboxModal" class="hidden-modal fixed inset-0 z-50 flex items-center justify-center bg-black/92 backdrop-blur-md p-2 sm:p-4 select-none">
        
        <!-- Top Toolbar -->
        <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 bg-gradient-to-b from-black/80 to-transparent">
            <!-- Counter -->
            <div class="text-white/90 font-medium text-sm md:text-base glass-btn px-3.5 py-1.5 rounded-full">
                <span id="lightboxCounter">1 / 1</span>
            </div>
            
            <!-- Close Button -->
            <button id="closeBtn" aria-label="סגור תמונה" class="glass-btn text-white text-xl w-10 h-10 rounded-full flex items-center justify-center focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Navigation Buttons -->
        <button id="prevBtn" aria-label="הקודם" class="glass-btn absolute left-3 md:left-6 text-white text-xl md:text-2xl w-12 h-12 rounded-full flex items-center justify-center z-20 focus:outline-none">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button id="nextBtn" aria-label="הבא" class="glass-btn absolute right-3 md:right-6 text-white text-xl md:text-2xl w-12 h-12 rounded-full flex items-center justify-center z-20 focus:outline-none">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Image Wrapper -->
        <div class="relative max-w-5xl max-h-[85vh] w-full h-full flex items-center justify-center p-2">
            <div id="imageWrapper" class="lightbox-img-container flex items-center justify-center max-w-full max-h-full">
                <img id="lightboxImage" src="" alt="תמונה מורחבת" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl transition-all duration-300">
            </div>
        </div>

        <!-- Touch Swipe Tip -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-xs text-white/50 bg-black/50 px-3 py-1 rounded-full md:hidden pointer-events-none">
            <i class="fa-solid fa-hand-pointer ml-1"></i> החלק ימינה / שמאלה לדפדוף
        </div>
    </div>

        // משתני מצב
        let currentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // אלמנטים
        const galleryGrid = document.getElementById('galleryGrid');
        const totalPhotosCount = document.getElementById('totalPhotosCount');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const imageWrapper = document.getElementById('imageWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const closeBtn = document.getElementById('closeBtn');

        /**
         * יצירת גלריית ה-Thumbnails עם התאמה מלאה למציג התמונה ללא חיתוך
         */
        function initGallery() {
            totalPhotosCount.textContent = IMAGE_FILES.length;
            galleryGrid.innerHTML = '';

            IMAGE_FILES.forEach((fileName, index) => {
                const fullUrl = BASE_PATH + fileName;
                
                const card = document.createElement('div');
                card.className = 'img-card glass-panel rounded-2xl overflow-hidden cursor-pointer group flex flex-col justify-between border border-slate-700/50';
                card.onclick = () => openLightbox(index);

                // שימוש ב-object-contain ורקע כהה מבטיח שכל התמונה מוצגת מבלי להיחתך
                card.innerHTML = `
                    <div class="relative aspect-square w-full bg-slate-900/90 flex items-center justify-center overflow-hidden p-2">
                        <!-- Blur Background Shadow Effect -->
                        <img 
                            src="${fullUrl}" 
                            alt=""
                            class="absolute inset-0 w-full h-full object-cover opacity-25 blur-md scale-110 pointer-events-none"
                        />
                        <!-- Main Image Fully Contained -->
                        <img 
                            src="${fullUrl}" 
                            alt="תמונה ${index + 1}" 
                            loading="lazy"
                            class="relative z-10 max-w-full max-h-full object-contain rounded transition-transform duration-300 group-hover:scale-105"
                            onerror="this.onerror=null; this.src='https://placehold.co/600x600/1e293b/ffffff?text=שגיאה+בטעינה';"
                        />
                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 z-20 bg-indigo-950/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center p-3">
                            <span class="text-white text-xs font-medium flex items-center gap-1.5 bg-indigo-600/80 px-3 py-1 rounded-full backdrop-blur-sm">
                                <i class="fa-solid fa-magnifying-glass-plus"></i> הגדל
                            </span>
                        </div>
                    </div>
                    <div class="p-3 bg-slate-900/60 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                        <span class="font-medium text-slate-300">תמונה #${index + 1}</span>
                        <i class="fa-regular fa-image text-slate-500"></i>
                    </div>
                `;

                galleryGrid.appendChild(card);
            });
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            lightboxModal.classList.remove('hidden-modal');
            lightboxModal.classList.add('active-modal');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active-modal');
            lightboxModal.classList.add('hidden-modal');
            document.body.style.overflow = '';
        }

        function updateLightboxContent() {
            imageWrapper.classList.add('sliding');
            setTimeout(() => {
                const fullUrl = BASE_PATH + IMAGE_FILES[currentIndex];
                lightboxImage.src = fullUrl;
                lightboxCounter.textContent = `${currentIndex + 1} / ${IMAGE_FILES.length}`;
                imageWrapper.classList.remove('sliding');
            }, 150);
        }

        function nextImage() {
            currentIndex = (currentIndex < IMAGE_FILES.length - 1) ? currentIndex + 1 : 0;
            updateLightboxContent();
        }

        function prevImage() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : IMAGE_FILES.length - 1;
            updateLightboxContent();
        }

        // אירועי לחיצה
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
        closeBtn.addEventListener('click', closeLightbox);

        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal || e.target === imageWrapper) {
                closeLightbox();
            }
        });

        // מקלדת
        document.addEventListener('keydown', (e) => {
            if (!lightboxModal.classList.contains('active-modal')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowRight') prevImage();
            else if (e.key === 'ArrowLeft') nextImage();
        });

        // Swipe מגע במובייל
        lightboxModal.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightboxModal.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff < 0) nextImage();
                else prevImage();
            }
        }

        window.onload = initGallery;
    </script>
</body>
</html>
